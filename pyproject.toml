[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-news-podcast"
version = "0.1.0"
description = "Autonomous daily news podcast pipeline with Railway primary deployment and local machine failover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "notebooklm-py>=0.8.6",
    "httpx>=0.27.0,<0.29",
    "feedparser>=6.0.11",
    "fpdf2>=2.8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
