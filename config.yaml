podcast:
  show_title: "Daily Morning Brief"
  show_description: "Autonomous two-host daily briefing covering global news, technology, and developing story arcs."
  author: "Suraj & AI Hosts"
  language: "en"
  episode_title_template: "Daily Brief — {date}"
  audio_format: "deep-dive"   # deep-dive | brief | critique | debate
  audio_length: "default"     # short | default | long
  mp3_bitrate: "192k"
  sample_rate: 44100
  target_lufs: -16.0
  intro_audio_path: ""        # Optional path to a 3-second intro chime .mp3/.wav
  cover_art_path: ""          # Optional path to square cover image .jpg/.png
  notebook_generation_timeout_seconds: 1800
  source_ready_timeout_seconds: 180
  delete_notebook_on_error: true

schedule:
  timezone: "Asia/Kolkata"
  primary_run_time: "06:00"
  failover_cutoff_minutes: 20
  lock_ttl_seconds: 2400
  http_timeout_seconds: 10.0

harvester:
  lookback_hours: 36
  min_articles_fallback: 12
  max_items_per_feed: 12
  max_clusters: 18
  top_headlines_count: 3
  developing_stories_count: 6
  cluster_similarity_threshold: 0.28
  arc_match_threshold: 0.22
  stale_arc_days: 7
  request_timeout_seconds: 15.0

feeds:
  - name: "BBC World"
    category: "World"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    weight: 1.2
  - name: "NPR World"
    category: "World"
    url: "https://feeds.npr.org/1004/rss.xml"
    weight: 1.1
  - name: "The Guardian World"
    category: "World"
    url: "https://www.theguardian.com/world/rss"
    weight: 1.1
  - name: "Hacker News"
    category: "Tech"
    url: "https://hnrss.org/frontpage"
    weight: 1.15
  - name: "TechCrunch"
    category: "Tech"
    url: "https://techcrunch.com/feed/"
    weight: 1.0
  - name: "Ars Technica"
    category: "Tech & Science"
    url: "https://feeds.arstechnica.com/arstechnica/index"
    weight: 1.0
  - name: "ArXiv CS.AI"
    category: "AI Research"
    url: "https://rss.arxiv.org/rss/cs.AI"
    weight: 0.9

