podcast:
  show_title: "Daily Morning Brief"
  show_description: "Concise daily briefing from reliable Indian media covering national news, international affairs, sports, and technology."
  author: "Suraj & AI Hosts"
  language: "en"
  episode_title_template: "Daily Brief — {date}"
  audio_format: "brief"       # deep-dive | brief | critique | debate
  audio_length: "short"       # short | default | long
  mp3_bitrate: "192k"
  sample_rate: 44100
  target_lufs: -16.0
  intro_audio_path: ""        # Optional path to a 3-second intro chime .mp3/.wav
  cover_art_path: "assets/cover.jpg"  # Square cover image .jpg/.png
  notebook_generation_timeout_seconds: 1800
  source_ready_timeout_seconds: 180
  delete_notebook_on_error: true

schedule:
  timezone: "Asia/Kolkata"
  primary_run_time: "06:00"
  failover_cutoff_minutes: 20
  lock_ttl_seconds: 2400
  http_timeout_seconds: 10.0

harvester:
  lookback_hours: 36
  min_articles_fallback: 12
  max_items_per_feed: 12
  max_clusters: 12
  top_headlines_count: 4
  developing_stories_count: 4
  cluster_similarity_threshold: 0.28
  arc_match_threshold: 0.22
  stale_arc_days: 7
  request_timeout_seconds: 15.0

